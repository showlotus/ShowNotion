services:
  shownotion:
    image: shownotion:latest
    container_name: shownotion
    env_file: .env.prod
    ports:
      - "3872:3000"
    restart: unless-stopped
    volumes:
      - ${STORAGE_PATH:-./data/storage}:/app/data/storage
      - ${MCP_UPLOAD_INBOX_HOST:-./data/inbox}:/tmp/shownotion-mcp-inbox

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shownotion
      POSTGRES_USER: shownotion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-STRONG_DB_PASSWORD}
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
